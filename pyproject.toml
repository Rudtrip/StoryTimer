[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "delayed-publishes"
version = "0.1.0"
description = "Telegram bot for delayed Telegram Stories publishing"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]

[project.scripts]
delayed-publishes-bot = "delayed_publishes.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
